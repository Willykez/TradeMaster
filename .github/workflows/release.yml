name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Gradle wrapper
        run: ./gradlew --version

      # A release build ships to real people.
      # Do not use the Firebase placeholder for releases.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_B64 secret is not configured."
            exit 1
          fi

          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      # Decode the release signing keystore.
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: KEYSTORE_B64 secret is not configured."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode > release.keystore

          echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"

      # Show the SHA-1 and SHA-256 fingerprints of the
      # certificate used to sign the release APK.
      - name: Show release signing fingerprints
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is not configured."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD secret is not configured."
            exit 1
          fi

          echo "========================================"
          echo "Release signing certificate fingerprints"
          echo "========================================"

          keytool -list -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            | grep -E "SHA1:|SHA256:"

          echo "========================================"

      # Build the signed release APK.
      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Find the generated APK.
      - name: Locate APK
        id: apk
        run: |
          apk_path=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$apk_path" ]; then
            echo "ERROR: No release APK was found."
            exit 1
          fi

          echo "Found APK: $apk_path"
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      # Verify the actual APK certificate as an additional check.
      - name: Verify APK signing certificate
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          echo "========================================"
          echo "Actual APK signing certificate"
          echo "========================================"

          apksigner verify --print-certs "$APK_PATH"

          echo "========================================"

      # Upload APK as a GitHub Actions artifact.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeMasterPro-release
          path: ${{ steps.apk.outputs.path }}

      # Create GitHub Release only when a v* tag is pushed.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true