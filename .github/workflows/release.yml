name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Gradle wrapper
        run: ./gradlew --version

      # A release build ships to real people -- unlike Build Check, there's
      # no placeholder fallback here on purpose. A release built against
      # fake Firebase credentials would silently ship broken sync/push/auth,
      # which is worse than the workflow just failing loudly.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_B64 secret is not configured."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: KEYSTORE_B64 secret is not configured."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode > release.keystore
          echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          apk_path=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$apk_path" ]; then
            echo "ERROR: No release APK was found."
            exit 1
          fi

          echo "Found APK: $apk_path"
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeMasterPro-release
          path: ${{ steps.apk.outputs.path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
